name: Build Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PKG_NAME: ultimate-linux-suite

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev debhelper make fakeroot build-essential

      - name: Create debian symlink
        run: |
          ln -sf packaging/debian debian

      - name: Build .deb package
        run: |
          # dpkg-buildpackage calls debian/rules which has override_dh_auto_build
          # to prevent recursion. Safe to call directly.
          dpkg-buildpackage -us -uc -b

      - name: Find and move .deb file
        id: find-deb
        run: |
          DEB_FILE=$(find .. -maxdepth 1 -name "${PKG_NAME}_*.deb" -type f | head -1)
          if [[ -n "$DEB_FILE" ]]; then
            DEB_NAME=$(basename "$DEB_FILE")
            mv "$DEB_FILE" .
            echo "deb_file=$DEB_NAME" >> "$GITHUB_OUTPUT"
            echo "Found: $DEB_NAME"
          else
            echo "ERROR: .deb file not found"
            exit 1
          fi

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: ${{ steps.find-deb.outputs.deb_file }}
          retention-days: 30

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Package version: $VERSION"

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build make gcc rpmdevtools

      - name: Setup rpmbuild directory structure
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

      - name: Create source tarball
        run: |
          # RPM spec expects tarball extracting to PKG_NAME-VERSION directory
          TARBALL_DIR="${PKG_NAME}-${PKG_VERSION}"

          # Create temp directory and copy sources
          mkdir -p /tmp/build-src/"$TARBALL_DIR"
          cp -r . /tmp/build-src/"$TARBALL_DIR"/

          # Remove .git directory from tarball
          rm -rf /tmp/build-src/"$TARBALL_DIR"/.git

          # Create tarball
          tar czf ~/rpmbuild/SOURCES/"${PKG_NAME}-${PKG_VERSION}.tar.gz" \
            -C /tmp/build-src "$TARBALL_DIR"

          echo "Created tarball: ${PKG_NAME}-${PKG_VERSION}.tar.gz"
          ls -la ~/rpmbuild/SOURCES/

      - name: Build RPM package
        run: |
          rpmbuild -ba packaging/rpm/${PKG_NAME}.spec

      - name: Find and copy RPM files
        id: find-rpm
        run: |
          # Find the built RPM (noarch)
          RPM_FILE=$(find ~/rpmbuild/RPMS -name "${PKG_NAME}-*.rpm" -type f | head -1)
          if [[ -n "$RPM_FILE" ]]; then
            RPM_NAME=$(basename "$RPM_FILE")
            cp "$RPM_FILE" .
            echo "rpm_file=$RPM_NAME" >> "$GITHUB_OUTPUT"
            echo "Found: $RPM_NAME"
          else
            echo "ERROR: .rpm file not found"
            exit 1
          fi

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: ${{ steps.find-rpm.outputs.rpm_file }}
          retention-days: 30

  build-tarball:
    name: Build Source Tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Create source tarball
        id: create-tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd ..
          TARBALL_NAME="${PKG_NAME}-${VERSION}.tar.gz"
          tar czf "$TARBALL_NAME" \
            --exclude='.git' \
            --exclude='*.deb' \
            --exclude='*.rpm' \
            "${PKG_NAME}/"
          mv "$TARBALL_NAME" "${PKG_NAME}/"
          echo "tarball_file=$TARBALL_NAME" >> "$GITHUB_OUTPUT"
          echo "Created: $TARBALL_NAME"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: ${{ steps.create-tarball.outputs.tarball_file }}
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-deb, build-rpm, build-tarball]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -ls

      - name: Prepare release assets
        id: prepare-assets
        run: |
          mkdir -p release-assets

          # Find and copy .deb
          DEB_FILE=$(find artifacts/debian-package -name "*.deb" -type f | head -1)
          if [[ -n "$DEB_FILE" ]]; then
            cp "$DEB_FILE" release-assets/
            echo "deb_file=$(basename "$DEB_FILE")" >> "$GITHUB_OUTPUT"
          fi

          # Find and copy .rpm
          RPM_FILE=$(find artifacts/rpm-package -name "*.rpm" -type f | head -1)
          if [[ -n "$RPM_FILE" ]]; then
            cp "$RPM_FILE" release-assets/
            echo "rpm_file=$(basename "$RPM_FILE")" >> "$GITHUB_OUTPUT"
          fi

          # Find and copy tarball
          TARBALL_FILE=$(find artifacts/source-tarball -name "*.tar.gz" -type f | head -1)
          if [[ -n "$TARBALL_FILE" ]]; then
            cp "$TARBALL_FILE" release-assets/
            echo "tarball_file=$(basename "$TARBALL_FILE")" >> "$GITHUB_OUTPUT"
          fi

          echo "Release assets:"
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
