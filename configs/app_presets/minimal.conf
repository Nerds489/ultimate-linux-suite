# Minimal Application Preset
# Ultimate Linux Suite
#
# Essential utilities for any system
#

[preset]
name=Minimal Essentials
description=Core utilities for a minimal but functional system
category=utilities

[packages]
# Text editors
vim=Vi improved text editor
nano=Simple text editor

# File management
mc=Midnight Commander file manager
tree=Directory listing as tree
ncdu=NCurses disk usage analyzer

# Network tools
curl=Command line URL tool
wget=Network file retriever
net-tools=Network utilities
openssh-client=SSH client

# System monitoring
htop=Interactive process viewer
neofetch=System information tool

# Archive tools
zip=ZIP compression
unzip=ZIP extraction
p7zip=7-Zip compression

# Text processing
jq=JSON processor

# Version control
git=Distributed version control

# Shell
bash-completion=Bash tab completion
tmux=Terminal multiplexer

[post_install]
# No special post-install needed
