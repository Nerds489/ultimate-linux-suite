# Gaming Application Preset
# Ultimate Linux Suite
#
# Applications for gaming setup
#

[preset]
name=Gaming Setup
description=Gaming platforms, tools, and performance utilities
category=gaming

[packages]
# Gaming platforms
steam=Steam gaming platform
lutris=Lutris game manager
heroic=Heroic Epic Games and GOG launcher
bottles=Bottles Windows application runner

# Compatibility layers
wine=Wine Windows compatibility layer
wine-staging=Wine with additional patches

# Performance tools
gamemode=Feral Interactive's game mode daemon
mangohud=Vulkan/OpenGL overlay for monitoring
goverlay=MangoHud configuration GUI
gamescope=SteamOS session compositor

# Proton management
protonup-qt=Proton version manager GUI

# Controllers
antimicrox=Controller to keyboard/mouse mapper

# Voice chat
discord=Voice and text chat

[flatpak]
com.valvesoftware.Steam=Steam
net.lutris.Lutris=Lutris
com.heroicgameslauncher.hgl=Heroic Games Launcher
com.usebottles.bottles=Bottles
net.davidotek.pupgui2=ProtonUp-Qt
com.discordapp.Discord=Discord

[post_install]
# Enable 32-bit libraries for Steam
enable_multilib=true
# Add user to input group for controller access
add_group=input
