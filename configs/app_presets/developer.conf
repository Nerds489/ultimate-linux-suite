# Developer Application Preset
# Ultimate Linux Suite
#
# Development tools and utilities
#

[preset]
name=Developer Workstation
description=Programming languages, IDEs, and development utilities
category=development

[packages]
# Version control
git=Distributed version control
git-lfs=Git Large File Storage

# Build essentials
build-essential=C/C++ compilation tools
gcc=GNU C Compiler
make=Build automation tool
cmake=Cross-platform build system
meson=Modern build system

# Editors and IDEs
vim=Vi improved text editor
neovim=Modern Vim fork
vscode=Visual Studio Code

# Python
python3=Python 3 interpreter
python3-pip=Python package manager
python3-venv=Python virtual environments

# Node.js
nodejs=Node.js JavaScript runtime
npm=Node.js package manager

# Go and Rust
golang=Go programming language
rust=Rust programming language
cargo=Rust package manager

# Containers
docker=Container platform
docker-compose=Multi-container Docker applications
podman=Daemonless container engine

# Utilities
curl=Command line URL tool
wget=Network file retriever
jq=JSON processor
tmux=Terminal multiplexer
htop=Interactive process viewer
fzf=Fuzzy finder
ripgrep=Fast grep alternative
bat=cat with syntax highlighting

# Debugging
gdb=GNU Debugger
valgrind=Memory debugging tool
strace=System call tracer

[flatpak]
com.visualstudio.code=Visual Studio Code
com.jetbrains.IntelliJ-IDEA-Community=IntelliJ IDEA
io.podman_desktop.PodmanDesktop=Podman Desktop
com.getpostman.Postman=Postman
io.dbeaver.DBeaverCommunity=DBeaver

[post_install]
# Add user to docker group
add_group=docker
