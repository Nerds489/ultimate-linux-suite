# Content Creator Application Preset
# Ultimate Linux Suite
#
# Media production and creative tools
#

[preset]
name=Content Creator
description=Video editing, streaming, graphics, and audio production
category=creative

[packages]
# Video editing
kdenlive=Professional video editor
shotcut=Cross-platform video editor
openshot=Simple video editor
handbrake=Video transcoder
pitivi=Simple video editor

# Streaming and recording
obs-studio=Open Broadcaster Software
ffmpeg=Multimedia framework

# Graphics and design
gimp=GNU Image Manipulation Program
inkscape=Vector graphics editor
krita=Digital painting application
blender=3D creation suite
darktable=Photography workflow
rawtherapee=Raw photo processor
imagemagick=Image manipulation tools
pinta=Simple image editor

# Audio
audacity=Audio editor and recorder
lollypop=Music player

# Media players
vlc=VLC media player
mpv=Lightweight media player

# Communication
discord=Voice and text chat

[flatpak]
org.kde.kdenlive=Kdenlive
com.obsproject.Studio=OBS Studio
org.gimp.GIMP=GIMP
org.inkscape.Inkscape=Inkscape
org.kde.krita=Krita
org.blender.Blender=Blender
org.darktable.Darktable=darktable
org.audacityteam.Audacity=Audacity
fr.handbrake.ghb=HandBrake
com.discordapp.Discord=Discord

[post_install]
# No special post-install needed
