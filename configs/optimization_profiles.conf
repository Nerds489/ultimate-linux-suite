# Optimization Profiles Configuration
# Ultimate Linux Suite
#
# This file defines system optimization profiles.
# Each profile contains settings for various system parameters.
#
# Format:
#   [profile_name]
#   setting=value
#

[desktop]
description=Balanced settings for general desktop use
swappiness=60
vm.dirty_ratio=20
vm.dirty_background_ratio=10
cpu_governor=schedutil
io_scheduler=mq-deadline
vm.vfs_cache_pressure=100

[gaming]
description=Low latency settings optimized for gaming
swappiness=10
vm.dirty_ratio=10
vm.dirty_background_ratio=5
cpu_governor=performance
io_scheduler=none
vm.vfs_cache_pressure=50
kernel.sched_migration_cost_ns=5000000

[server]
description=High throughput settings for server workloads
swappiness=30
vm.dirty_ratio=40
vm.dirty_background_ratio=10
cpu_governor=ondemand
io_scheduler=mq-deadline
vm.vfs_cache_pressure=50
net.core.somaxconn=65535

[laptop]
description=Power-saving settings for laptop battery life
swappiness=60
vm.dirty_ratio=30
vm.dirty_background_ratio=5
cpu_governor=powersave
io_scheduler=bfq
vm.vfs_cache_pressure=100
vm.laptop_mode=5

[workstation]
description=Balanced performance for productivity workloads
swappiness=40
vm.dirty_ratio=30
vm.dirty_background_ratio=10
cpu_governor=schedutil
io_scheduler=bfq
vm.vfs_cache_pressure=75

[minimal]
description=Conservative settings for minimal resource usage
swappiness=80
vm.dirty_ratio=40
vm.dirty_background_ratio=10
cpu_governor=powersave
io_scheduler=bfq
vm.vfs_cache_pressure=150
